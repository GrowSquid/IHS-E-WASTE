<meta charset="utf-8">

<title> Energy Preservation</title>
<style>
    body {

    #scene-image {
        display: block;
        margin: 1rem auto;

    #title-screen {
        margin: 1rem auto;
        max-width: 90%;
        max-height: 300px;
    }

        margin: 1rem 0;
        padding: 0.5rem 1rem;

        color: #ffffff;
        font-family: monospace;
        border: 1px solid #6cf0c6;
        cursor: pointer;
        transition: background 0.3s, color 0.3s;
    }
    #options {
        list-style: none;
        padding: 0;
        margin: 0;
    }

        content: "> ";
        color: #a08040; }
    button:hover {
        background: #35260f;
        color: #ffe5a8;
        }

<body>

<main>
<img id="title-screen" src="images/Energy Conservation.jpg">

<div id="text"></div>

</main>

}
// Engine, it IS AI GENERATED SORRY :( 
function show(id) {
  const scene = GUIDE.scenes[id];
  const titleScreen = document.getElementById("title-screen");
  titleScreen.hidden = (id !== "start");
  document.getElementById("text").textContent = scene.text.trim();
  const list = document.getElementById("options");
  list.innerHTML = "";
  scene.options.forEach(function (opt) {
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.textContent = opt.label;
    button.onclick = function () { show(opt.goto); };
    li.append(button);
    list.append(li);
    const img = document.getElementById("scene-image");
  if (scene.image) {
    img.src = scene.image;
    img.alt = scene.imageAlt || "";
    img.hidden = false;
  } else {
    img.hidden = true;
  }
  });
}
 
document.title = GUIDE.title;
show("start");

</script>
